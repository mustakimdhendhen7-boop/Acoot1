<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acoot Smart Books</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e6eaf0;--primary:#2457e6;--primary2:#173fae;--danger:#d83a52;--good:#16845b;--shadow:0 8px 28px #18243b12}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:238px;background:#111a2d;color:#fff;padding:20px 14px;z-index:3}.brand{font-weight:800;font-size:23px;padding:5px 10px 22px}.brand span{color:#78a1ff}.nav button{display:block;width:100%;border:0;background:transparent;color:#b8c1d2;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#233252;color:#fff}.main{margin-left:238px}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:2}.company{font-weight:700}.content{padding:24px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:8px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--text)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;text-transform:uppercase;color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2ff;color:var(--primary);font-size:12px}.page{display:none}.page.active{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{margin:0 0 5px}.muted{color:var(--muted)}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #d9dee8;border-radius:9px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal{position:fixed;inset:0;background:#0c132b88;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}.toast{position:fixed;right:18px;bottom:18px;background:#111a2d;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:20}.empty{padding:28px;text-align:center;color:var(--muted)}.airesult{background:#f7f9fc;border:1px solid var(--line);padding:12px;border-radius:10px;font-size:13px;white-space:pre-wrap}.login-tabs{display:flex;gap:6px;margin:18px 0}.login-tabs button{flex:1}.hide{display:none!important}@media(max-width:850px){.side{position:relative;width:100%;height:auto}.main{margin-left:0}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.top{position:relative}}@media(max-width:560px){.grid{grid-template-columns:1fr}.content{padding:14px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>Acoot <span style="color:#2457e6">Smart Books</span></h1><div class="muted">Indian accounting • GST • AI receipt capture</div><div class="login-tabs"><button id="loginTab" class="btn primary" onclick="authMode('login')">Login</button><button id="regTab" class="btn" onclick="authMode('register')">Create account</button></div><div id="authForm"></div></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">Acoot <span>Smart Books</span></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><span class="company" id="companyName"></span></div><div style="display:flex;gap:8px;align-items:center"><select id="companySelect" onchange="switchCompany(this.value)"></select><button class="btn" onclick="logout()">Logout</button></div></div><div class="content" id="content"></div></main></div>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('acootToken')||'',me=null,page='dashboard',cache={};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>'₹'+Number(x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
async function api(path,opt={}){const r=await fetch('/api/'+path,{...opt,headers:{...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}});let x=null;try{x=await r.json()}catch{}if(!r.ok)throw Error(x?.error||'Request failed');return x}
function authMode(mode){$('loginTab').className='btn '+(mode==='login'?'primary':'');$('regTab').className='btn '+(mode==='register'?'primary':'');$('authForm').innerHTML=mode==='login'?`<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Login</button>`:`<div class="field"><label>Your name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><div class="field"><label>Company name</label><input id="company" value="My Company"></div><div class="field"><label>GSTIN (optional)</label><input id="gstin"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="register()">Create account</button>`}
async function login(){try{const x=await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});token=x.token;localStorage.setItem('acootToken',token);await bootApp()}catch(e){toast(e.message)}}
async function register(){try{const x=await api('register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value,password:$('password').value,companyName:$('company').value,gstin:$('gstin').value})});token=x.token;localStorage.setItem('acootToken',token);await bootApp()}catch(e){toast(e.message)}}
async function boot(){authMode('login');if(token){try{await bootApp()}catch{localStorage.removeItem('acootToken');token=''}}}
async function bootApp(){me=await api('me');$('login').style.display='none';$('app').style.display='flex';$('companySelect').innerHTML=me.companies.map(c=>`<option value="${c.id}" ${c.id===me.companyId?'selected':''}>${esc(c.name)}</option>`).join('');buildNav();await go('dashboard')}
function buildNav(){const items=[['dashboard','Dashboard'],['vouchers','Vouchers'],['ledgers','Ledgers'],['customers','Customers'],['suppliers','Suppliers'],['products','Products'],['receipts','AI Receipts'],['reports','Reports']];$('nav').innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
async function switchCompany(id){try{await api('switch-company',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({companyId:id})});me=await api('me');$('companyName').textContent=me.companies.find(x=>x.id===me.companyId)?.name||'';cache={};await go(page)}catch(e){toast(e.message)}}
async function go(p){page=p;buildNav();$('companyName').textContent=me.companies.find(x=>x.id===me.companyId)?.name||'';try{if(p==='dashboard')return dashboard();if(p==='vouchers')return vouchers();if(p==='ledgers')return ledgers();if(p==='customers')return contacts('customer');if(p==='suppliers')return contacts('supplier');if(p==='products')return products();if(p==='receipts')return receipts();if(p==='reports')return reports()}catch(e){toast(e.message)}}
function cardStat(label,value){return `<div class="card stat"><small>${label}</small><strong>${money(value)}</strong></div>`}
async function dashboard(){const d=await api('dashboard');$('content').innerHTML=`<div class="grid">${cardStat('Sales',d.sales)}${cardStat('Purchases',d.purchases)}${cardStat('Payments',d.payments)}${cardStat('Net Profit',d.profit)}</div><div class="grid2"><div class="card"><div class="head"><h2>Recent vouchers</h2><button class="btn" onclick="go('vouchers')">View all</button></div>${d.recent.length?`<div class="tablewrap"><table class="table"><thead><tr><th>No.</th><th>Type</th><th>Date</th><th>Amount</th></tr></thead><tbody>${d.recent.map(x=>`<tr><td>${esc(x.voucherNo)}</td><td><span class="badge">${esc(x.voucherType)}</span></td><td>${esc(String(x.date).slice(0,10))}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No vouchers yet.</div>`}</div><div class="card"><h2>Quick actions</h2><button class="btn primary" style="width:100%;margin:5px 0" onclick="voucherForm('Sales')">+ Sales</button><button class="btn" style="width:100%;margin:5px 0" onclick="voucherForm('Purchase')">+ Purchase</button><button class="btn" style="width:100%;margin:5px 0" onclick="receiptUpload()">AI Receipt</button></div></div>`}
function table(title,button,headers,rows){return `<div class="card"><div class="head"><h2>${title}</h2>${button}</div><div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records</td></tr>`}</tbody></table></div></div>`}
async function vouchers(){const rows=await api('vouchers');$('content').innerHTML=table('Vouchers',`<button class="btn primary" onclick="voucherForm('Journal')">+ New Voucher</button>`,['Voucher No','Type','Date','Amount','Status'],rows.map(x=>`<tr><td>${esc(x.voucherNo)}</td><td><span class="badge">${esc(x.voucherType)}</span></td><td>${esc(String(x.date).slice(0,10))}</td><td>${money(x.amount)}</td><td>${esc(x.status)}</td></tr>`).join(''))}
async function ledgers(){const rows=await api('ledgers');$('content').innerHTML=table('Ledgers',`<button class="btn primary" onclick="ledgerForm()">+ Ledger</button>`,['Name','Group','Type','Opening'],rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.group)}</td><td>${esc(x.type)}</td><td>${money(x.openingBalance)}</td></tr>`).join(''))}
async function contacts(kind){const rows=await api('contacts?kind='+kind);$('content').innerHTML=table(kind==='customer'?'Customers':'Suppliers',`<button class="btn primary" onclick="contactForm('${kind}')">+ ${kind}</button>`,['Name','Phone','GSTIN','Email'],rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.gstin)}</td><td>${esc(x.email)}</td></tr>`).join(''))}
async function products(){const rows=await api('products');$('content').innerHTML=table('Products',`<button class="btn primary" onclick="productForm()">+ Product</button>`,['Item','SKU','HSN/SAC','GST','Sale Price','Stock'],rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.sku)}</td><td>${esc(x.hsnSac)}</td><td>${x.gstRate}%</td><td>${money(x.salePrice)}</td><td>${x.stock}</td></tr>`).join(''))}
async function receipts(){const rows=await api('receipts');$('content').innerHTML=`<div class="card"><div class="head"><div><h2>AI Receipt Capture</h2><div class="muted">Upload a receipt/invoice. Acoot stores it and, when AI is configured, extracts accounting fields.</div></div><button class="btn primary" onclick="receiptUpload()">Upload</button></div>${rows.length?rows.map(x=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><a href="/api/receipts/${encodeURIComponent(x.id)}" target="_blank">${esc(x.fileName)}</a> <span class="badge">${esc(x.status)}</span>${x.extracted?`<div class="airesult">${esc(JSON.stringify(x.extracted,null,2))}</div>`:''}</div>`).join(''):`<div class="empty">No receipts uploaded.</div>`}</div>`}
async function reports(){const r=await api('reports');$('content').innerHTML=`<div class="grid">${cardStat('Sales',r.profitAndLoss.sales)}${cardStat('Purchases',r.profitAndLoss.purchases)}${cardStat('Net Profit',r.profitAndLoss.netProfit)}${cardStat('Net GST Payable',r.gst.net)}</div><div class="grid2"><div class="card"><h2>Profit & Loss</h2><p>Sales: <b>${money(r.profitAndLoss.sales)}</b></p><p>Purchases: <b>${money(r.profitAndLoss.purchases)}</b></p><p>Net profit: <b>${money(r.profitAndLoss.netProfit)}</b></p></div><div class="card"><h2>GST Summary</h2><p>Output GST: <b>${money(r.gst.output)}</b></p><p>Input GST: <b>${money(r.gst.input)}</b></p><p>Net: <b>${money(r.gst.net)}</b></p></div></div>`}
function modal(title,body,save){$('modalbox').innerHTML=`<div class="head"><h2>${title}</h2><button class="btn" onclick="closeM()">×</button></div>${body}<div class="actions"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="${save}">Save</button></div>`;$('modal').classList.add('show')}
function closeM(){$('modal').classList.remove('show')}
const v=id=>$('f_'+id)?.value||'';
async function ledgerForm(){modal('New Ledger',`<div class="formgrid"><div class="field"><label>Name</label><input id="f_name"></div><div class="field"><label>Group</label><input id="f_group" value="General"></div><div class="field"><label>Type</label><select id="f_type"><option>asset</option><option>liability</option><option>income</option><option>expense</option><option>equity</option></select></div><div class="field"><label>Opening balance</label><input id="f_opening" type="number" value="0"></div><div class="field"><label>GSTIN</label><input id="f_gstin"></div></div>`,'saveLedger()')}
async function saveLedger(){try{await api('ledgers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('name'),group:v('group'),type:v('type'),openingBalance:+v('opening')||0,gstin:v('gstin')})});closeM();await go('ledgers');toast('Ledger saved')}catch(e){toast(e.message)}}
function contactForm(kind){modal('New '+kind,`<div class="formgrid"><div class="field"><label>Name</label><input id="f_name"></div><div class="field"><label>Phone</label><input id="f_phone"></div><div class="field"><label>GSTIN</label><input id="f_gstin"></div><div class="field"><label>Email</label><input id="f_email"></div><div class="field full"><label>Address</label><textarea id="f_address"></textarea></div></div>`,'saveContact(\''+kind+'\')')}
async function saveContact(kind){try{await api('contacts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,name:v('name'),phone:v('phone'),gstin:v('gstin'),email:v('email'),address:v('address')})});closeM();await go(kind==='customer'?'customers':'suppliers');toast('Saved')}catch(e){toast(e.message)}}
function productForm(){modal('New Product',`<div class="formgrid"><div class="field"><label>Name</label><input id="f_name"></div><div class="field"><label>SKU</label><input id="f_sku"></div><div class="field"><label>HSN/SAC</label><input id="f_hsn"></div><div class="field"><label>GST %</label><input id="f_gst" type="number" value="18"></div><div class="field"><label>Sale price</label><input id="f_sale" type="number" value="0"></div><div class="field"><label>Purchase price</label><input id="f_purchase" type="number" value="0"></div><div class="field"><label>Opening stock</label><input id="f_stock" type="number" value="0"></div></div>`,'saveProduct()')}
async function saveProduct(){try{await api('products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('name'),sku:v('sku'),hsnSac:v('hsn'),gstRate:+v('gst')||0,salePrice:+v('sale')||0,purchasePrice:+v('purchase')||0,stock:+v('stock')||0})});closeM();await go('products');toast('Product saved')}catch(e){toast(e.message)}}
async function voucherForm(type){const ls=await api('ledgers');const opts=ls.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');modal('New '+type,`<div class="formgrid"><div class="field"><label>Voucher type</label><select id="f_type"><option>${type}</option><option>Sales</option><option>Purchase</option><option>Receipt</option><option>Payment</option><option>Contra</option><option>Journal</option><option>Credit Note</option><option>Debit Note</option></select></div><div class="field"><label>Date</label><input id="f_date" type="date" value="${today()}"></div><div class="field"><label>Debit ledger</label><select id="f_debit">${opts}</select></div><div class="field"><label>Credit ledger</label><select id="f_credit">${opts}</select></div><div class="field"><label>Amount</label><input id="f_amount" type="number" step="0.01" value="0"></div><div class="field"><label>GST type</label><select id="f_gstType"><option value="">None</option><option>CGST+SGST</option><option>IGST</option></select></div><div class="field"><label>GST rate %</label><input id="f_gstRate" type="number" value="0"></div><div class="field full"><label>Narration</label><textarea id="f_narration"></textarea></div></div><p class="muted">Acoot will reject the voucher unless total debit equals total credit.</p>`,'saveVoucher()')}
async function saveVoucher(){try{const amount=+v('amount')||0;await api('vouchers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voucherType:v('type'),date:v('date'),narration:v('narration'),gstType:v('gstType'),gstRate:+v('gstRate')||0,entries:[{ledgerId:v('debit'),debit:amount,credit:0},{ledgerId:v('credit'),debit:0,credit:amount}]})});closeM();await go('vouchers');toast('Voucher posted')}catch(e){toast(e.message)}}
function receiptUpload(){$('modalbox').innerHTML=`<div class="head"><h2>AI Receipt / Invoice</h2><button class="btn" onclick="closeM()">×</button></div><div class="field"><label>Receipt image or PDF</label><input id="receiptFile" type="file" accept="image/*,.pdf"></div><p class="muted">The file is stored in persistent object storage. If OPENAI_API_KEY is configured, Acoot will extract invoice fields automatically.</p><div class="actions"><button class="btn" onclick="closeM()">Cancel</button><button class="btn primary" onclick="uploadReceipt()">Upload & Extract</button></div>`;$('modal').classList.add('show')}
async function uploadReceipt(){try{const f=$('receiptFile').files[0];if(!f)return toast('Choose a receipt first');const fd=new FormData();fd.append('file',f);const r=await fetch('/api/ai/receipt',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const x=await r.json();if(!r.ok)throw Error(x.error||'Upload failed');closeM();await go('receipts');toast(x.status==='extracted'?'Receipt uploaded and AI-extracted':'Receipt uploaded')}catch(e){toast(e.message)}}
function logout(){localStorage.removeItem('acootToken');location.reload()}boot();
</script></body></html>
